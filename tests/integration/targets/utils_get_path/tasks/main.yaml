---
- name: Recursively find all test files
  ansible.builtin.find:
    file_type: file
    paths: "{{ role_path }}/tasks"
    recurse: false
    use_regex: true
    patterns:
      - ^(?!_|main).+$
  register: found
  delegate_to: localhost

- name: Include tasks
  ansible.builtin.include_tasks: "{{ item.path }}"
  loop: "{{ found.files }}"
